# Ingress — public via Cloudflare
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debarras-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: debarras.sacenpapier.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debarras-frontend
                port:
                  number: 80
    - host: debarrasapi.sacenpapier.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debarras-backend
                port:
                  number: 8002
